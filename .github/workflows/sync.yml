name: Sync Kanon DiscoAdamusa Playlist

on:
  # Automatyczne uruchamianie codziennie o godzinie 3:00 w nocy (UTC)
  schedule:
    - cron: '0 3 * * *'
  # Pozwala na ręczne kliknięcie "Run workflow" w zakładce Actions
  workflow_dispatch:
  # Uruchamia się automatycznie przy opublikowaniu nowego Release'a
  release:
    types: [published, edited]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generowanie nowego index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_site.py

      - name: Commit i Push zmian do repozytorium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-sync playlist: update index.html"
            git pull --rebase origin main
            git push origin main
          fi
