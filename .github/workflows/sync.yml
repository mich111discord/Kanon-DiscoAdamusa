name: Sync Kanon DiscoAdamusa Playlist

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  release:
    types: [published, edited]

# Zapobiega nakładaniu się na siebie kilku równoległych uruchomień (np. przy edycji Release).
# Grupa jest STAŁA (nie zależy od github.ref), bo event 'release' odpala się z różnym
# ref (tag 'latest', tag 'thumbnails' itd.) - a wszystkie te uruchomienia i tak
# pushują na ten sam branch 'main', więc muszą być serializowane wspólnie.
concurrency:
  group: ${{ github.workflow }}-sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # WAŻNE: event 'release' domyślnie checkout'uje commit WSKAZYWANY PRZEZ TAG,
          # co ląduje w detached HEAD (nie na branchu). git push origin main wtedy
          # zawodzi z błędem "src refspec main does not match any". Wymuszamy więc
          # checkout brancha main niezależnie od tego, co odpaliło workflow.
          ref: main

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generowanie nowego index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_site.py

      - name: Commit i Push zmian do repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracks.json

          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync playlist: update index.html"

            success=false
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin main; then
                success=true
                break
              fi
              echo "Push odrzucony, próba ponowna ($i)..."
              sleep $((RANDOM % 5 + 1))
            done

            if [ "$success" != "true" ]; then
              echo "Nie udało się wypchnąć zmian po kilku próbach."
              exit 1
            fi
          else
            echo "Brak zmian do zacommitowania."
          fi
