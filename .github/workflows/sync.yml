name: Sync Kanon DiscoAdamusa Playlist

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generowanie nowego index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_site.py

      - name: Commit i Push zmian do repozytorium
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync playlist: update index.html" && git push origin main)
