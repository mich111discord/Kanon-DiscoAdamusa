<!DOCTYPE html>
<html lang="pl">
<head>
    <meta name="google-site-verification" content="zvPy-nSxXiQ60eB7nVstzKsxkePUdcs0Z53Jtj-_V0E" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanon DiscoAdamusa 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --panel: #181818;
            --panel-hover: #272727;
            --border: #222222;
            --red: #ff0000;
            --text: #f1f1f1;
            --text-dim: #aaa;
            --discord: #5865F2;
            --radius: 12px;
            --badge-new: #10b981;
            --badge-hot: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Preloader Screen */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loader-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-logo {
            font-size: 3rem;
            animation: pulse 1.5s infinite alternate;
        }

        .loader-gif-container {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-gif {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        header {
            background-color: #0f0f0f;
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-logo-icon {
            color: #f59e0b;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--discord);
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 18px;
            font-weight: 500;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .discord-btn:hover {
            opacity: 0.9;
        }

        .yt-grid {
            max-width: 1750px;
            margin: 0 auto;
            width: 100%;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 1024px) {
            .yt-grid {
                grid-template-columns: 1fr 400px;
            }
        }

        .player-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            aspect-ratio: 16 / 9;
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 1;
            transition: opacity 0.3s ease;
            user-select: none;
        }

        .video-wrapper.hide-controls .player-controls {
            opacity: 0;
            pointer-events: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.25);
            cursor: pointer;
            position: relative;
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        .progress-bar-container:hover {
            height: 10px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--red);
            width: 0%;
            border-radius: 3px;
            position: relative;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 18px;
            font-size: 0.85rem;
            transition: background 0.2s, transform 0.1s, color 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn.saved {
            color: #ef4444;
        }

        .volume-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-slider {
            width: 0px;
            opacity: 0;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            height: 4px;
            border-radius: 2px;
            outline: none;
            transition: width 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
        }

        .volume-group:hover .volume-slider {
            width: 60px;
            opacity: 1;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
        }

        .time-display {
            font-size: 0.8rem;
            color: #ddd;
        }

        #now-playing {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text);
        }

        .meta-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            color: var(--text-dim);
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .meta-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .views-count {
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        #search-box {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        #search-box:focus {
            border-color: #3ea6ff;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            color: var(--text-dim);
            pointer-events: none;
        }

        .playlist-card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 180px);
        }

        .playlist-header {
            padding: 12px 16px;
            background-color: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .playlist-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .playlist-title {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .filter-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--badge-hot);
            color: #fff;
        }

        #track-count {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        #playlist-box {
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 100%;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .track-item:hover {
            background-color: var(--panel-hover);
        }

        .track-item.active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .track-thumb-wrap {
            position: relative;
            width: 100px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
        }

        .track-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-thumb.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #202020;
            color: var(--text-dim);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            min-width: 0;
            flex-grow: 1;
        }

        .track-title-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .track-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.2;
        }

        .track-item.active .track-title {
            color: #3ea6ff;
        }

        .save-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.1s;
        }

        .save-btn:hover {
            color: #ef4444;
            background: rgba(255,255,255,0.05);
        }

        .save-btn.saved {
            color: #ef4444;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .badge-new {
            background-color: var(--badge-new);
            color: #000;
        }

        .badge-hot {
            background-color: var(--badge-hot);
            color: #fff;
        }

        .track-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #playlist-box::-webkit-scrollbar {
            width: 6px;
        }
        #playlist-box::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .loading-msg, .error-msg {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        footer {
            margin-top: auto;
            padding: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
        }

        .version-badge {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(24, 24, 24, 0.85);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            color: var(--text-dim);
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="loader-logo">👑</div>
        <div class="loader-gif-container">
            <img src="https://i.gifer.com/ZZ5H.gif" alt="Ładowanie..." class="loader-gif" onerror="this.style.display='none'; document.getElementById('alt-spinner').style.display='block';">
            <div id="alt-spinner" class="loader-spinner" style="display:none;"></div>
        </div>
        <div style="font-size: 0.9rem; color: var(--text-dim);">Ładowanie hitów DiscoAdamusa...</div>
    </div>

    <header>
        <a href="#" class="brand">
            <i data-lucide="crown" class="brand-logo-icon"></i>
            <span class="brand-title">Kanon DiscoAdamusa</span>
        </a>
        <a href="https://discord.gg/ErbWv3kKCB" target="_blank" class="discord-btn">
            <i data-lucide="message-square" style="width:16px; height:16px;"></i>
            Dołącz do Discorda
        </a>
    </header>

    <main class="yt-grid">
        <section class="player-container">
            <div class="video-wrapper" id="video-wrapper">
                <video id="player" preload="metadata"></video>
                <div class="player-controls">
                    <div class="progress-bar-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div class="controls-row">
                        <div class="controls-left">
                            <button class="ctrl-btn" id="play-btn" title="Odtwórz / Pauza (Spacja)">
                                <i data-lucide="play"></i>
                            </button>
                            <button class="ctrl-btn" id="save-player-btn" title="Zapisz utwór">
                                <i data-lucide="bookmark" id="save-player-icon"></i>
                                <span id="save-player-text">Zapisz</span>
                            </button>
                            <div class="volume-group">
                                <button class="ctrl-btn" id="mute-btn" title="Wycisz">
                                    <i data-lucide="volume-2"></i>
                                </button>
                                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                            </div>
                            <span class="time-display"><span id="curr-time">0:00</span> / <span id="dur-time">0:00</span></span>
                        </div>
                        <div class="controls-right">
                            <button class="ctrl-btn" id="fs-btn" title="Pełny ekran">
                                <i data-lucide="maximize"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <h1 id="now-playing">Wybierz utwór z listy...</h1>
            <div class="meta-bar">
                <div class="meta-left">
                    <span class="views-count" id="views-count">
                        <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
                        <span>-- odtworzeń</span>
                    </span>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <div class="search-wrap">
                <i data-lucide="search" class="search-icon" style="width: 18px; height: 18px;"></i>
                <input type="text" id="search-box" placeholder="Szukaj w klastrze hitów...">
            </div>

            <div class="playlist-card">
                <div class="playlist-header">
                    <div class="playlist-title-wrap">
                        <span class="playlist-title">Kolejka</span>
                        <button id="filter-saved-btn" class="filter-btn" title="Pokaż tylko zapisane">
                            <i data-lucide="bookmark" style="width:12px; height:12px;"></i> Zapisane
                        </button>
                    </div>
                    <span id="track-count">0 utworów</span>
                </div>
                <div id="playlist-box">
                    <div class="loading-msg">Ładowanie playlisty...</div>
                </div>
            </div>
        </aside>
    </main>

    <footer>
        Kanon DiscoAdamusa 2026 · Zbudowane w estetyce kinowej
    </footer>

    <div class="version-badge">Kanon v1.0.4</div>

    <script>
        const GITHUB_REPO_OWNER = "mich111discord";
        const GITHUB_REPO_NAME = "Kanon-DiscoAdamusa";

        let tracks = [];
        let githubDownloadsMap = {};
        let showOnlySaved = false;
        let currentTrackId = null;

        const videoWrapper = document.getElementById('video-wrapper');
        const player = document.getElementById('player');
        const nowPlaying = document.getElementById('now-playing');
        const playlistBox = document.getElementById('playlist-box');
        const searchBox = document.getElementById('search-box');
        const trackCount = document.getElementById('track-count');
        const viewsCount = document.getElementById('views-count');
        const loaderScreen = document.getElementById('loader-screen');
        const filterSavedBtn = document.getElementById('filter-saved-btn');

        const playBtn = document.getElementById('play-btn');
        const savePlayerBtn = document.getElementById('save-player-btn');
        const savePlayerText = document.getElementById('save-player-text');
        const muteBtn = document.getElementById('mute-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const currTimeEl = document.getElementById('curr-time');
        const durTimeEl = document.getElementById('dur-time');
        const fsBtn = document.getElementById('fs-btn');

        function getSavedTracks() {
            try {
                const local = localStorage.getItem('savedTracks');
                if (local) return JSON.parse(local);
            } catch (e) {}
            
            const name = "savedTracks=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(name) === 0) {
                    const val = c.substring(name.length, c.length);
                    return val ? val.split(',').map(String) : [];
                }
            }
            return [];
        }

        function toggleSaveTrack(id) {
            if (!id) return;
            let saved = getSavedTracks().map(String);
            const idStr = String(id);
            if (saved.includes(idStr)) {
                saved = saved.filter(item => item !== idStr);
            } else {
                saved.push(idStr);
            }

            try {
                localStorage.setItem('savedTracks', JSON.stringify(saved));
            } catch (e) {}

            const d = new Date();
            d.setTime(d.getTime() + (365 * 24 * 60 * 60 * 1000));
            document.cookie = `savedTracks=${saved.join(',')}; expires=${d.toUTCString()}; path=/`;

            updateSavePlayerButtonState();
            applyFiltersAndRender();
        }

        function updateSavePlayerButtonState() {
            if (!currentTrackId) {
                savePlayerBtn.style.display = 'none';
                return;
            }
            savePlayerBtn.style.display = 'inline-flex';
            const saved = getSavedTracks().map(String);
            const isSaved = saved.includes(String(currentTrackId));

            if (isSaved) {
                savePlayerBtn.classList.add('saved');
                savePlayerText.innerText = 'Zapisano';
                savePlayerBtn.innerHTML = `<i data-lucide="bookmark-check" fill="currentColor"></i><span>Zapisano</span>`;
            } else {
                savePlayerBtn.classList.remove('saved');
                savePlayerText.innerText = 'Zapisz';
                savePlayerBtn.innerHTML = `<i data-lucide="bookmark"></i><span>Zapisz</span>`;
            }
            lucide.createIcons();
        }

        savePlayerBtn.addEventListener('click', () => {
            if (currentTrackId) {
                toggleSaveTrack(currentTrackId);
            }
        });

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function extractFilename(url) {
            try {
                const parsedUrl = new URL(url);
                const parts = parsedUrl.pathname.split('/');
                return parts[parts.length - 1];
            } catch (e) {
                return '';
            }
        }

        async function fetchGitHubDownloads() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/releases`);
                if (!res.ok) return;
                const releases = await res.json();
                
                releases.forEach(release => {
                    if (release.assets && Array.isArray(release.assets)) {
                        release.assets.forEach(asset => {
                            githubDownloadsMap[asset.name] = asset.download_count;
                        });
                    }
                });
            } catch (e) {
                console.warn("Nie udało się pobrać danych z GitHub API:", e);
            }
        }

        function togglePlay() {
            if (player.paused) {
                player.play();
                playBtn.innerHTML = '<i data-lucide="pause"></i>';
            } else {
                player.pause();
                playBtn.innerHTML = '<i data-lucide="play"></i>';
            }
            lucide.createIcons();
        }

        playBtn.addEventListener('click', togglePlay);

        videoWrapper.addEventListener('click', (e) => {
            if (e.target === player) {
                togglePlay();
            }
        });

        videoWrapper.addEventListener('dblclick', (e) => {
            if (e.target === player) {
                toggleFullscreen();
            }
        });

        let controlsTimeout;
        videoWrapper.addEventListener('mousemove', () => {
            videoWrapper.classList.remove('hide-controls');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (!player.paused) {
                    videoWrapper.classList.add('hide-controls');
                }
            }, 2500);
        });

        player.addEventListener('timeupdate', () => {
            const pct = (player.currentTime / player.duration) * 100;
            progressBar.style.width = `${pct}%`;
            currTimeEl.innerText = formatTime(player.currentTime);
            durTimeEl.innerText = formatTime(player.duration);
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            player.currentTime = pos * player.duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            player.volume = e.target.value;
            player.muted = player.volume === 0;
            updateMuteIcon();
        });

        muteBtn.addEventListener('click', () => {
            player.muted = !player.muted;
            if (player.muted) {
                volumeSlider.value = 0;
            } else {
                volumeSlider.value = player.volume || 1;
            }
            updateMuteIcon();
        });

        function updateMuteIcon() {
            if (player.muted || player.volume === 0) {
                muteBtn.innerHTML = '<i data-lucide="volume-x"></i>';
            } else if (player.volume < 0.5) {
                muteBtn.innerHTML = '<i data-lucide="volume-1"></i>';
            } else {
                muteBtn.innerHTML = '<i data-lucide="volume-2"></i>';
            }
            lucide.createIcons();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoWrapper.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        fsBtn.addEventListener('click', toggleFullscreen);

        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'KeyF') {
                toggleFullscreen();
            }
        });

        function renderPlaylist(list) {
            playlistBox.innerHTML = '';
            if (list.length === 0) {
                playlistBox.innerHTML = '<div class="loading-msg">Brak utworów</div>';
                return;
            }

            const savedTrackIds = getSavedTracks().map(String);

            list.forEach((track) => {
                const item = document.createElement('div');
                item.className = 'track-item';
                item.dataset.id = track.id;

                if (String(track.id) === String(getCurrentIdFromUrl())) {
                    item.classList.add('active');
                }

                const filename = extractFilename(track.url);
                const downloads = githubDownloadsMap[filename] !== undefined ? githubDownloadsMap[filename] : null;
                const viewsText = downloads !== null ? ` · <i data-lucide="eye" style="width:12px;height:12px;display:inline;"></i> ${downloads}` : '';

                const thumbHtml = track.thumbnail
                    ? `<img class="track-thumb" src="${track.thumbnail}" alt="" loading="lazy">`
                    : `<div class="track-thumb placeholder"><i data-lucide="music"></i></div>`;

                let badgesHtml = '';
                if (track.isNew) {
                    badgesHtml += `<span class="badge badge-new">NEW</span>`;
                }
                if (track.isHot) {
                    badgesHtml += `<span class="badge badge-hot"><i data-lucide="flame" style="width:10px;height:10px;"></i> HOT</span>`;
                }

                const isSaved = savedTrackIds.includes(String(track.id));
                const bookmarkIcon = isSaved ? 'bookmark-check' : 'bookmark';
                const bookmarkClass = isSaved ? 'save-btn saved' : 'save-btn';

                item.innerHTML = `
                    <div class="track-thumb-wrap">
                        ${thumbHtml}
                    </div>
                    <div class="track-info">
                        <div class="track-title-container">
                            <span class="track-title">${track.title}</span>
                            ${badgesHtml}
                        </div>
                        <div class="track-meta">#${track.id} · ${track.size || 'HD'}${viewsText}</div>
                    </div>
                    <button class="${bookmarkClass}" data-id="${track.id}" title="${isSaved ? 'Usuń z zapisanych' : 'Zapisz utwór'}">
                        <i data-lucide="${bookmarkIcon}" ${isSaved ? 'fill="currentColor"' : ''} style="width:16px; height:16px;"></i>
                    </button>
                `;

                item.addEventListener('click', (e) => {
                    if (e.target.closest('.save-btn')) return;
                    playTrackById(track.id, true);
                });

                const saveBtn = item.querySelector('.save-btn');
                saveBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleSaveTrack(track.id);
                });

                playlistBox.appendChild(item);
            });

            lucide.createIcons();
        }

        function applyFiltersAndRender() {
            const query = searchBox.value.toLowerCase().trim();
            const savedTrackIds = getSavedTracks().map(String);

            let filtered = tracks.filter(track => {
                const matchesSearch = track.title.toLowerCase().includes(query);
                const matchesSaved = showOnlySaved ? savedTrackIds.includes(String(track.id)) : true;
                return matchesSearch && matchesSaved;
            });

            trackCount.innerText = `${filtered.length} utworów`;
            renderPlaylist(filtered);
        }

        filterSavedBtn.addEventListener('click', () => {
            showOnlySaved = !showOnlySaved;
            filterSavedBtn.classList.toggle('active', showOnlySaved);
            applyFiltersAndRender();
        });

        function getCurrentIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function setIdInUrl(id) {
            const url = new URL(window.location);
            url.searchParams.set('id', id);
            history.replaceState({}, '', url);
        }

        function playTrackById(id, updateUrl) {
            const trackIndex = tracks.findIndex(t => String(t.id) === String(id));
            if (trackIndex === -1) return;

            currentTrackId = id;
            updateSavePlayerButtonState();

            const track = tracks[trackIndex];
            player.src = track.url;
            nowPlaying.innerText = `${track.title}`;
            
            const filename = extractFilename(track.url);
            const downloads = githubDownloadsMap[filename];
            if (downloads !== undefined) {
                viewsCount.innerHTML = `<i data-lucide="eye" style="width: 16px; height: 16px;"></i> <span>${downloads.toLocaleString()} odtworzeń</span>`;
            } else {
                viewsCount.innerHTML = `<i data-lucide="eye" style="width: 16px; height: 16px;"></i> <span>-- odtworzeń</span>`;
            }

            player.play().then(() => {
                playBtn.innerHTML = '<i data-lucide="pause"></i>';
            }).catch(() => {
                playBtn.innerHTML = '<i data-lucide="play"></i>';
            });
            lucide.createIcons();

            if (updateUrl) {
                setIdInUrl(track.id);
            }

            document.querySelectorAll('.track-item').forEach(el => {
                el.classList.toggle('active', String(el.dataset.id) === String(track.id));
            });
        }

        searchBox.addEventListener('input', applyFiltersAndRender);

        player.addEventListener('ended', () => {
            const currentUrl = player.src;
            const currentIndex = tracks.findIndex(t => t.url === currentUrl);
            let nextIndex = currentIndex + 1;

            if (nextIndex >= tracks.length) {
                nextIndex = 0;
            }

            if (tracks[nextIndex]) {
                playTrackById(tracks[nextIndex].id, true);
            }
        });

        async function init() {
            await fetchGitHubDownloads();

            try {
                const res = await fetch('tracks.json?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                tracks = await res.json();
                
                applyFiltersAndRender();

                if (tracks.length > 0) {
                    const requestedId = getCurrentIdFromUrl();
                    const requestedTrack = tracks.find(t => String(t.id) === String(requestedId));

                    if (requestedTrack) {
                        playTrackById(requestedTrack.id, false);
                    } else {
                        playTrackById(tracks[0].id, false);
                    }
                }
            } catch (err) {
                playlistBox.innerHTML = `<div class="error-msg">❌ Błąd ładowania playlisty (${err.message})</div>`;
                console.error(err);
            } finally {
                setTimeout(() => {
                    loaderScreen.classList.add('hidden');
                }, 500);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            init();
        });
    </script>
</body>
</html>
