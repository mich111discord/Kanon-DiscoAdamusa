<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanon DiscoAdamusa 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --panel: #181818;
            --panel-hover: #272727;
            --border: #222222;
            --red: #ff0000;
            --text: #f1f1f1;
            --text-dim: #aaa;
            --discord: #5865F2;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #0f0f0f;
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-logo {
            font-size: 1.6rem;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--discord);
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 18px;
            font-weight: 500;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .discord-btn:hover {
            opacity: 0.9;
        }

        .yt-grid {
            max-width: 1750px;
            margin: 0 auto;
            width: 100%;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 1024px) {
            .yt-grid {
                grid-template-columns: 1fr 400px;
            }
        }

        .player-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            aspect-ratio: 16 / 9;
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Udoskonalony nakładany interfejs odtwarzacza */
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 1;
            transition: opacity 0.3s ease;
            user-select: none;
        }

        .video-wrapper.hide-controls .player-controls {
            opacity: 0;
            pointer-events: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.25);
            cursor: pointer;
            position: relative;
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        .progress-bar-container:hover {
            height: 10px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--red);
            width: 0%;
            border-radius: 3px;
            position: relative;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s, transform 0.1s;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .ctrl-btn:active {
            transform: scale(0.9);
        }

        /* Kontrola głośności */
        .volume-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-slider {
            width: 0px;
            opacity: 0;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            height: 4px;
            border-radius: 2px;
            outline: none;
            transition: width 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
        }

        .volume-group:hover .volume-slider {
            width: 60px;
            opacity: 1;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
        }

        .time-display {
            font-size: 0.8rem;
            color: #ddd;
        }

        #now-playing {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text);
        }

        .meta-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            color: var(--text-dim);
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .meta-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .views-count {
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cdn-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--panel);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .cdn-dot {
            width: 8px;
            height: 8px;
            background-color: #2ba640;
            border-radius: 50%;
            box-shadow: 0 0 6px #2ba640;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-wrap {
            position: relative;
        }

        #search-box {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        #search-box:focus {
            border-color: #3ea6ff;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .playlist-card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 650px;
        }

        .playlist-header {
            padding: 12px 16px;
            background-color: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .playlist-title {
            font-size: 0.95rem;
            font-weight: 700;
        }

        #track-count {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        #playlist-box {
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .track-item {
            display: flex;
            gap: 10px;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .track-item:hover {
            background-color: var(--panel-hover);
        }

        .track-item.active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .track-thumb-wrap {
            position: relative;
            width: 100px;
            height: 56px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
        }

        .track-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-thumb.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #202020;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            min-width: 0;
        }

        .track-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.2;
        }

        .track-item.active .track-title {
            color: #3ea6ff;
        }

        .track-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        #playlist-box::-webkit-scrollbar {
            width: 6px;
        }
        #playlist-box::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .loading-msg, .error-msg {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        footer {
            margin-top: auto;
            padding: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand">
            <span class="brand-logo">👑</span>
            <span class="brand-title">Kanon DiscoAdamusa</span>
        </a>
        <a href="https://discord.gg/ErbWv3kKCB" target="_blank" class="discord-btn">
            Dołącz do Discorda
        </a>
    </header>

    <main class="yt-grid">
        <section class="player-container">
            <div class="video-wrapper" id="video-wrapper">
                <video id="player" preload="metadata"></video>
                <div class="player-controls">
                    <div class="progress-bar-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div class="controls-row">
                        <div class="controls-left">
                            <button class="ctrl-btn" id="play-btn" title="Odtwórz / Pauza (Spacja)">▶</button>
                            <div class="volume-group">
                                <button class="ctrl-btn" id="mute-btn" title="Wycisz">🔊</button>
                                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                            </div>
                            <span class="time-display"><span id="curr-time">0:00</span> / <span id="dur-time">0:00</span></span>
                        </div>
                        <div class="controls-right">
                            <button class="ctrl-btn" id="fs-btn" title="Pełny ekran">⛶</button>
                        </div>
                    </div>
                </div>
            </div>

            <h1 id="now-playing">Wybierz utwór z listy...</h1>
            <div class="meta-bar">
                <div class="meta-left">
                    <span class="views-count" id="views-count">👁️ -- odtworzeń</span>
                </div>
                <div class="cdn-badge">
                    <div class="cdn-dot"></div>
                    <span>GitHub Releases CDN · 1080p</span>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-box" placeholder="Szukaj w klastrze hitów...">
            </div>

            <div class="playlist-card">
                <div class="playlist-header">
                    <span class="playlist-title">Kolejka odtwarzania</span>
                    <span id="track-count">0 utworów</span>
                </div>
                <div id="playlist-box">
                    <div class="loading-msg">Ładowanie playlisty...</div>
                </div>
            </div>
        </aside>
    </main>

    <footer>
        Kanon DiscoAdamusa 2026 · Zbudowane w estetyce kinowej
    </footer>

    <script>
        
        const GITHUB_REPO_OWNER = "mich111discord";
        const GITHUB_REPO_NAME = "Kanon-DiscoAdamusa";

        let tracks = [];
        let githubDownloadsMap = {};

        const videoWrapper = document.getElementById('video-wrapper');
        const player = document.getElementById('player');
        const nowPlaying = document.getElementById('now-playing');
        const playlistBox = document.getElementById('playlist-box');
        const searchBox = document.getElementById('search-box');
        const trackCount = document.getElementById('track-count');
        const viewsCount = document.getElementById('views-count');

        const playBtn = document.getElementById('play-btn');
        const muteBtn = document.getElementById('mute-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const currTimeEl = document.getElementById('curr-time');
        const durTimeEl = document.getElementById('dur-time');
        const fsBtn = document.getElementById('fs-btn');

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function extractFilename(url) {
            try {
                const parsedUrl = new URL(url);
                const parts = parsedUrl.pathname.split('/');
                return parts[parts.length - 1];
            } catch (e) {
                return '';
            }
        }

        // Pobieranie liczby pobrań z GitHub API
        async function fetchGitHubDownloads() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/releases`);
                if (!res.ok) return;
                const releases = await res.json();
                
                releases.forEach(release => {
                    if (release.assets && Array.isArray(release.assets)) {
                        release.assets.forEach(asset => {
                            githubDownloadsMap[asset.name] = asset.download_count;
                        });
                    }
                });
            } catch (e) {
                console.warn("Nie udało się pobrać danych z GitHub API:", e);
            }
        }

        // Obsługa sterowania wideo
        function togglePlay() {
            if (player.paused) {
                player.play();
                playBtn.innerText = '⏸';
            } else {
                player.pause();
                playBtn.innerText = '▶';
            }
        }

        playBtn.addEventListener('click', togglePlay);

        videoWrapper.addEventListener('click', (e) => {
            if (e.target === player) {
                togglePlay();
            }
        });

        videoWrapper.addEventListener('dblclick', (e) => {
            if (e.target === player) {
                toggleFullscreen();
            }
        });

        // Ukrywanie paska po bezczynności myszy
        let controlsTimeout;
        videoWrapper.addEventListener('mousemove', () => {
            videoWrapper.classList.remove('hide-controls');
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (!player.paused) {
                    videoWrapper.classList.add('hide-controls');
                }
            }, 2500);
        });

        player.addEventListener('timeupdate', () => {
            const pct = (player.currentTime / player.duration) * 100;
            progressBar.style.width = `${pct}%`;
            currTimeEl.innerText = formatTime(player.currentTime);
            durTimeEl.innerText = formatTime(player.duration);
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            player.currentTime = pos * player.duration;
        });

        // Kontrola dźwięku
        volumeSlider.addEventListener('input', (e) => {
            player.volume = e.target.value;
            player.muted = player.volume === 0;
            updateMuteIcon();
        });

        muteBtn.addEventListener('click', () => {
            player.muted = !player.muted;
            if (player.muted) {
                volumeSlider.value = 0;
            } else {
                volumeSlider.value = player.volume || 1;
            }
            updateMuteIcon();
        });

        function updateMuteIcon() {
            if (player.muted || player.volume === 0) {
                muteBtn.innerText = '🔇';
            } else if (player.volume < 0.5) {
                muteBtn.innerText = '🔉';
            } else {
                muteBtn.innerText = '🔊';
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoWrapper.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        fsBtn.addEventListener('click', toggleFullscreen);

        // Skróty klawiszowe
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'KeyF') {
                toggleFullscreen();
            }
        });

        function renderPlaylist(list) {
            playlistBox.innerHTML = '';
            if (list.length === 0) {
                playlistBox.innerHTML = '<div class="loading-msg">Brak wyników 👁️👄👁️</div>';
                return;
            }

            list.forEach((track) => {
                const item = document.createElement('div');
                item.className = 'track-item';
                item.dataset.id = track.id;

                if (String(track.id) === String(getCurrentIdFromUrl())) {
                    item.classList.add('active');
                }

                const filename = extractFilename(track.url);
                const downloads = githubDownloadsMap[filename] !== undefined ? githubDownloadsMap[filename] : null;
                const viewsText = downloads !== null ? ` · 👁️ ${downloads}` : '';

                const thumbHtml = track.thumbnail
                    ? `<img class="track-thumb" src="${track.thumbnail}" alt="" loading="lazy">`
                    : `<div class="track-thumb placeholder">🎵</div>`;

                item.innerHTML = `
                    <div class="track-thumb-wrap">
                        ${thumbHtml}
                    </div>
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-meta">#${track.id} · ${track.size || 'HD'}${viewsText}</div>
                    </div>
                `;
                item.addEventListener('click', () => playTrackById(track.id, true));
                playlistBox.appendChild(item);
            });
        }

        function getCurrentIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function setIdInUrl(id) {
            const url = new URL(window.location);
            url.searchParams.set('id', id);
            history.replaceState({}, '', url);
        }

        function playTrackById(id, updateUrl) {
            const trackIndex = tracks.findIndex(t => String(t.id) === String(id));
            if (trackIndex === -1) return;

            const track = tracks[trackIndex];
            player.src = track.url;
            nowPlaying.innerText = `${track.title}`;
            
            const filename = extractFilename(track.url);
            const downloads = githubDownloadsMap[filename];
            if (downloads !== undefined) {
                viewsCount.innerText = `👁️ ${downloads.toLocaleString()} odtworzeń`;
            } else {
                viewsCount.innerText = `👁️ -- odtworzeń`;
            }

            player.play().then(() => {
                playBtn.innerText = '⏸';
            }).catch(() => {
                playBtn.innerText = '▶';
            });

            if (updateUrl) {
                setIdInUrl(track.id);
            }

            document.querySelectorAll('.track-item').forEach(el => {
                el.classList.toggle('active', String(el.dataset.id) === String(track.id));
            });
        }

        searchBox.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = tracks.filter(track => track.title.toLowerCase().includes(query));
            renderPlaylist(filtered);
        });

        player.addEventListener('ended', () => {
            const currentUrl = player.src;
            const currentIndex = tracks.findIndex(t => t.url === currentUrl);
            let nextIndex = currentIndex + 1;

            if (nextIndex >= tracks.length) {
                nextIndex = 0;
            }

            if (tracks[nextIndex]) {
                playTrackById(tracks[nextIndex].id, true);
            }
        });

        // Inicjalizacja danych
        async function init() {
            await fetchGitHubDownloads();

            try {
                const res = await fetch('tracks.json?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                tracks = await res.json();
                
                trackCount.innerText = `${tracks.length} utworów`;
                renderPlaylist(tracks);

                if (tracks.length === 0) return;

                const requestedId = getCurrentIdFromUrl();
                const requestedTrack = tracks.find(t => String(t.id) === String(requestedId));

                if (requestedTrack) {
                    playTrackById(requestedTrack.id, false);
                } else {
                    playTrackById(tracks[0].id, false);
                }
            } catch (err) {
                playlistBox.innerHTML = `<div class="error-msg">❌ Błąd ładowania playlisty (${err.message})</div>`;
                console.error(err);
            }
        }

        init();
    </script>
</body>
</html>
